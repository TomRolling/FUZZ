name: Build FUZZ (multi-OS)

# Se déclenche quand tu pousses un tag de version (ex: v1.0.0), ou manuellement
# depuis l'onglet "Actions" de ton dépôt GitHub.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Sans ce bloc, le GITHUB_TOKEN automatique n'a que des droits de lecture,
# et la création de Release échoue avec "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  # Ce commit a-t-il deja passe les tests rapides ? C'est le cas d'une version poussee sur main (la mise
  # en ligne web les lance, pages.yml) puis taguee : inutile de les refaire. Dans le doute (erreur,
  # rien trouve), la reponse est non et les tests tournent.
  deja-teste:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      oui: ${{ steps.cherche.outputs.oui }}
    steps:
      - id: cherche
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --status success --json workflowName \
               --jq '[.[] | select(.workflowName == "Version web (GitHub Pages)" or .workflowName == "Tests rapides")] | length' 2>/dev/null || echo 0)
          if [ "${n:-0}" -gt 0 ] 2>/dev/null; then echo "oui=true" >> "$GITHUB_OUTPUT"; else echo "oui=false" >> "$GITHUB_OUTPUT"; fi
          echo "Tests rapides deja passes sur ce commit : ${n:-0} execution(s) trouvee(s)"

  # Les tests rapides d'abord (tests.yml) : une version qui les echoue n'est pas construite.
  tests:
    needs: deja-teste
    if: needs.deja-teste.outputs.oui != 'true'
    uses: ./.github/workflows/tests.yml

  # Construite si les tests viennent de passer, ou s'ils avaient deja passe (job saute) ; jamais s'ils echouent.
  build:
    needs: [deja-teste, tests]
    if: ${{ !cancelled() && !failure() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      # Versions d'actions qui tournent sur Node 24 : GitHub a deprecie Node 20 (les anciennes
      # versions affichaient un avertissement a chaque build et finiront par ne plus fonctionner).
      - uses: actions/checkout@v5

      - name: Installer les dépendances système Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev patchelf build-essential curl wget file libxdo-dev libayatana-appindicator3-dev

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Installer les dépendances npm
        run: npm install

      - name: Générer les icônes (icns/ico/png) depuis la source haute résolution
        run: npx tauri icon app-icon-source.png

      - name: Builder l'app (via tauri-action)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Clé privée utilisée pour signer les mises à jour (indispensable pour que
          # l'updater embarqué dans l'app accepte le téléchargement). À créer une fois
          # dans les secrets du dépôt GitHub — voir README, section "Mises à jour auto".
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Si le déclencheur est un tag (push), publie automatiquement une Release GitHub
          # avec les installeurs attachés. En déclenchement manuel, build seulement (pas de release).
          tagName: ${{ github.ref_name }}
          releaseName: 'FUZZ ${{ github.ref_name }}'
          releaseBody: 'Installeurs générés automatiquement pour Windows, macOS et Linux.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          # L'envoi des fichiers vers la Release echoue parfois cote GitHub (« Error creating asset
          # temp dir » sur macOS en 0.6.1, apres une construction pourtant reussie) : on reessaie.
          retryAttempts: 3
          args: ${{ matrix.args }}
