[package]
name = "jardin-idle"
version = "1.0.0"
description = "Jardin Idle - jeu idle de jardinage"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "jardin-idle"
path = "src/main.rs"
